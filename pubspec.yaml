name: catbreeds
description: "Catbreeds — catálogo de razas de gato sobre The Cat API. Prueba técnica móvil."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Estado + DI
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^17.0.0

  # Red + errores
  dio: ^5.9.0
  fpdart: ^1.2.0
  equatable: ^2.0.7
  talker: ^5.1.1
  talker_dio_logger: ^5.1.1

  # Configuración por entorno (compile-time, ofuscada)
  envied: ^1.3.2

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  envied_generator: ^1.3.2
  build_runner: ^2.10.4
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_app.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#C8502A"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#C8502A"
  image: "assets/images/splash_mark.png"
  android_12:
    color: "#C8502A"
    image: "assets/images/splash_mark.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  # Fraunces (display) + Geist (sistema) + Geist Mono (etiquetas).
  # Ver `lib/core/constants/app_fonts.dart`. Licencias OFL en assets/fonts/OFL.txt.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-400-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-400.ttf
          weight: 400
        - asset: assets/fonts/Geist-500.ttf
          weight: 500
        - asset: assets/fonts/Geist-600.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-500.ttf
          weight: 500

# path_provider_foundation 2.6 trae `objective_c`, que usa build hooks, y
# con el SDK de Dart 3.10 `build_runner` no puede compilar su script
# ("'dart compile' does not support build hooks"). 2.5.1 es la versión que
# usa APP-121PASS. Quitar cuando el SDK del CI sea >= 3.11.
dependency_overrides:
  path_provider_foundation: 2.5.1
