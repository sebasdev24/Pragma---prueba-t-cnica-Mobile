name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.3'

jobs:
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Envied necesita los .env para generar código. La key sale del secret
      # CAT_API_KEY; las pruebas no llaman a la red, así que vacía también
      # compila.
      - name: Create environment files
        run: |
          for env in dev prod; do
            echo "BASE_URL=https://api.thecatapi.com/v1" > .env.$env
            echo "CAT_API_KEY=${{ secrets.CAT_API_KEY }}" >> .env.$env
          done
          echo "ENABLE_DEBUG_TOOLS=true" >> .env.dev
          echo "ENABLE_DEBUG_TOOLS=false" >> .env.prod

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage
